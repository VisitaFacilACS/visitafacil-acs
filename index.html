<!DOCTYPE html>
<html lang="pt-BR">
<head>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#007bff">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VisitaFácil ACS</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
body{margin:0;font-family:Arial;background:#eef2f7}

.primary{background:#007bff;color:#fff}
.success{background:#28a745;color:#fff}
.danger{background:#dc3545;color:#fff}
.secondary{background:#6c757d;color:#fff}

.row{
 display:flex;
 gap:8px;
}

.row input{
 flex:1;
}

/* TELAS */
/* ATIVAÇÃO (caixa centralizada) */
#ativacao{
position:fixed;
top:0;left:0;
width:100%;height:100%;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#007bff,#28a745);
z-index:9999;
}

button{
 border:none;
 cursor:pointer;
}

/* ABERTURA (layout vertical bonito) */
#abertura{
 position:fixed;
 top:0;
 left:0;
 width:100%;
 height:100%;

 display:flex;
 flex-direction:column;

 justify-content:center;
 align-items:center;

 background:linear-gradient(135deg,#007bff,#28a745);

 padding:20px;
 box-sizing:border-box;
}

#abertura input{
width:100%;
max-width:300px;
padding:10px;
border-radius:8px;
border:none;
}

#abertura button{
width:100%;
max-width:300px;
padding:12px;
border-radius:10px;
border:none;
background:#000;
color:#fff;
}

/* CAIXA INTERNA (resolve layout feio) */
.box{
background:#ffffff;
color:#333;
padding:20px;
border-radius:15px;
width:100%;
max-width:320px;
box-shadow:0 5px 20px rgba(0,0,0,0.2);
}

/* inputs mais bonitos */
.box input{
width:100%;
padding:10px;
margin-top:8px;
border-radius:8px;
border:1px solid #ccc;
}

/* botão bonito */
.box button{
width:100%;
padding:12px;
margin-top:12px;
border:none;
border-radius:10px;
background:#007bff;
color:#fff;
font-weight:bold;
cursor:pointer;
}

button.success{
 font-size:18px;
 padding:16px;
 border-radius:14px;
 box-shadow:0 6px 15px rgba(40,167,69,0.3);
}

.box button:hover{
background:#0056b3;
}

/* CONTEÚDO */
.container{padding:15px;margin-bottom:80px}
.card{background:#fff;padding:15px;border-radius:12px;margin-bottom:12px}
.row{display:flex;gap:5px}

/* ASSINATURA */
#assinaturaTela{
 position:fixed;
 top:0;
 left:0;
 width:100%;
 height:100%;
 background:#f8f9fa;
 display:none;
 flex-direction:column;
 justify-content:center;
 align-items:center;
 z-index:99999;
 padding:15px;
}

.canvas-container{
 width:100%;
 max-width:500px;
 height:250px;
 background:#fff;
 border:2px dashed #aaa;
 border-radius:10px;
}

#canvas{
 width:100%;
 height:100%;
 touch-action:none; /* ESSENCIAL */
}

.assinatura-botoes{
 width:100%;
 max-width:500px;
 display:flex;
 gap:5px;
 margin-top:10px;
}

.assinatura-botoes button{
 flex:1;
}

/* ===== CORREÇÃO DO FORM ===== */
#formTela{
 display:block;
}

#formTela .container{
 max-width:600px;
 margin:auto;
}

/* organiza os campos */
#formTela input,
#formTela textarea,
#formTela select{
 width:100%;
 padding:10px;
 margin:8px 0;
 border-radius:8px;
 border:1px solid #ccc;
 box-sizing:border-box;
}

/* botões organizados */
#formTela button{
 width:100%;
 padding:12px;
 margin-top:8px;
 border-radius:10px;
 border:none;
 font-weight:bold;
}

/* espaço entre blocos */
#formTela h2{
 display:flex;
 align-items:center;
 gap:8px;
}

/* ===== LAYOUT PROFISSIONAL ===== */

body{
 font-family: system-ui, -apple-system, Arial;
 background:#eef2f7;
 color:#333;
}

/* HEADER */
.header{
 background:linear-gradient(90deg,#007bff,#00c6ff);
 color:#fff;
 padding:18px 10px;
 font-size:18px;
 font-weight:600;
 text-align:center;
 box-shadow:0 2px 8px rgba(0,0,0,0.15);
}

/* CONTAINER */
.container{
 max-width:600px;
 margin:auto;
 padding:16px;
 padding-bottom:140px; /* AUMENTADO */
}

/* TÍTULO */
h2{
 font-size:22px;
 margin:10px 0 15px;
}

/* CAMPOS */
input, textarea, select{
 width:100%;
 padding:14px;
 margin:10px 0;
 border-radius:12px;
 border:1px solid #ddd;
 font-size:16px;
 background:#fff;
 box-shadow: inset 0 1px 3px rgba(0,0,0,0.05);
}

/* FOCO */
input:focus, textarea:focus, select:focus{
 outline:none;
 border:1px solid #007bff;
 box-shadow:0 0 0 2px rgba(0,123,255,0.2);
}

/* BOTÕES */
button{
 width:100%;
 padding:14px;
 border-radius:12px;
 border:none;
 font-size:16px;
 font-weight:600;
 margin-top:8px;
 transition:0.2s;
 min-height:48px;
}

.btn-blue{
 background:#007bff;
 color:#fff;
 box-shadow:0 4px 10px rgba(0,123,255,0.3);
}

.btn-gray{
 background:#6c757d;
 color:#fff;
}

.btn-light{
 background:#6c757d;
 color:#fff;
 box-shadow:0 3px 8px rgba(0,0,0,0.2);
}

.btn-outline{
 background:#007bff;
 color:#fff;
 border:none;
 box-shadow:0 4px 10px rgba(0,123,255,0.3);
}

/* CORES BOTÕES */
.primary{
 background:#007bff !important;
 color:#fff !important;
}

.success{
 background:#28a745 !important;
 color:#fff !important;
}

.secondary{
 background:#e9ecef !important;
 color:#212529 !important;
 border:1px solid #ced4da;
 box-shadow:0 2px 6px rgba(0,0,0,0.08);
}

.danger{
 background:#dc3545 !important;
 color:#fff !important;
}

/* CARD HISTÓRICO */
.card{
 background:#fff;
 padding:16px;
 border-radius:16px;
 margin-bottom:12px;
 box-shadow:0 4px 10px rgba(0,0,0,0.08);
}

/* LINHA */
.row{
 display:flex;
 gap:10px;
}

/* BOTÕES DENTRO CARD */
.card button{
 font-size:14px;
 padding:10px;
}

/* MENU PROFISSIONAL */
.bottom-nav{
 position:fixed;
 bottom:0;
 width:100%;
 height:70px;

 display:flex;
 justify-content:space-around;
 align-items:center;

 background:#ffffff;
 border-top:1px solid #eaeaea;

 box-shadow:0 -4px 15px rgba(0,0,0,0.08);
 z-index:999;
}

/* BOTÕES */
.bottom-nav button{
 flex:1;
 height:100%;

 background:none;
 border:none;

 display:flex;
 flex-direction:column;
 justify-content:center;
 align-items:center;

 font-size:12px;
 font-weight:600;
 color:#777;

 transition:0.2s;
}

/* ÍCONE */
.bottom-nav button span{
 font-size:20px;
 margin-bottom:2px;
}

/* ATIVO */
.bottom-nav button.active{
 color:#007bff;
}

/* CLICK */
.bottom-nav button:active{
 transform:scale(0.95);
}

/* BANNER */
.banner{
 width:100vw;
 margin-left:calc(-50vw + 50%);
 height:110px;
 object-fit:contain;
 background:#fff;
 border-bottom:1px solid #eee;
}

/* ASSINATURA */
#assinaturaTela{
 background:#f4f6f9;
}

.canvas-container{
 border-radius:16px;
 border:2px dashed #bbb;
}

/* RELATÓRIO */
#relatorio{
 background:#fff;
 padding:15px;
 border-radius:12px;
 box-shadow:0 4px 10px rgba(0,0,0,0.08);
 line-height:1.6;
}

#historicoTela input[type="date"]{
 width:100%;
 height:48px;
 padding:0 14px;

 border-radius:12px;
 border:1px solid #ddd;

 font-size:16px;
 background:#fff;

 appearance:none;
 -webkit-appearance:none;
}

#historicoTela label{
 display:block;
 font-size:14px;
 font-weight:600;
 margin-top:10px;
 margin-bottom:4px;
 color:#555;
}

/* CORRIGE INPUT DATE */
input[type="date"]{
 width:100%;
 padding:14px;
 border-radius:12px;
 border:1px solid #ddd;
 font-size:16px;
 background:#fff;
 box-sizing:border-box;
}

/* REMOVE EXCESSO DO ÍCONE */
input[type="date"]::-webkit-calendar-picker-indicator{
 position:absolute;
 right:10px;
 cursor:pointer;
}

/* GARANTE POSICIONAMENTO */
#filtroData{
 position:relative;
}

/* BLOCO ESTILO BOTÃO PARA DATA */
.campo-data{
 background:#fff;
 padding:12px;
 border-radius:12px;
 box-shadow:0 3px 8px rgba(0,0,0,0.08);
 margin:10px 0;
}

.campo-data label{
 display:block;
 font-size:13px;
 color:#666;
 margin-bottom:5px;
}

/* INPUT DATA AJUSTADO */
.campo-data input[type="date"]{
 width:100%;
 padding:12px;
 border-radius:10px;
 border:1px solid #ddd;
 font-size:16px;
 background:#fff;
}

/* REMOVE BUG DO ÍCONE ESTOURANDO */
.campo-data input[type="date"]::-webkit-calendar-picker-indicator{
 transform: scale(1.2);
 cursor:pointer;
}

.topo-relatorio{
 display:flex;
 flex-direction:column;
 gap:12px;
 margin-bottom:15px;
}

.card div button{
 flex:1;
}

.box-abertura{
 width:100%;
 max-width:320px;

 background:#fff;
 padding:25px;
 border-radius:18px;

 box-shadow:0 10px 30px rgba(0,0,0,0.2);

 display:flex;
 flex-direction:column;
 gap:12px;

 text-align:center;
}

.logo-abertura{
 width:180px;
 margin:0 auto 10px;
}

.box-abertura{
 animation:fadeIn 0.4s ease;
}

@keyframes fadeIn{
 from{opacity:0; transform:translateY(20px);}
 to{opacity:1; transform:translateY(0);}
}

</style>
</head>

<body>

<!-- ATIVAÇÃO -->
<div id="ativacao">
<div class="box">

<h2>🔐 Ativação</h2>

<p style="font-size:14px;">ID do aparelho:</p>
<b id="deviceId" style="font-size:14px;word-break:break-all;"></b>

<input id="codigo" placeholder="Código de ativação">

<button onclick="ativar()">Ativar</button>

</div>
</div>

<!-- ABERTURA -->
<div id="abertura" style="display:none;">

  <div class="box-abertura">

    <img src="logo.png" class="logo-abertura">

    <input id="ubs" placeholder="Nome da UBS">
    <input id="acs" placeholder="Nome do ACS">
    <input id="micro" placeholder="Micro área">

    <button onclick="abrirSistema()">Entrar no Sistema</button>

  </div>

</div>

<!-- HEADER -->
<div class="header" id="headerInfo" style="display:none;"></div>

<!-- FORM -->
<div id="formTela" style="display:none;">

  <img src="logo-horizontal.png" class="banner">

  <div class="container">

    <h2>📋 Visita Domiciliar</h2>

    <button class="btn-blue" onclick="limparFormulario()">🆕 Nova Visita</button>

    <input id="datetime" readonly>

    <input id="cep" placeholder="CEP" inputmode="numeric" pattern="[0-9]*">
    <button class="btn-outline" onclick="buscarCEP()">Buscar CEP</button>

    <input id="endereco" placeholder="Endereço">

    <div class="row">
      <input 
  id="numero" 
  placeholder="Número"
  inputmode="numeric"
  pattern="[0-9]*"
  oninput="this.value=this.value.replace(/\D/g,'')"
>
      <input id="complemento" placeholder="Complemento">
    </div>

    <input id="responsavel" placeholder="Responsável">

    <div id="membros"></div>
    <button class="btn-light" onclick="addMembro()">+ Membro</button>

    <select id="motivo">
      <option value="">Motivo</option>
      <option>Periódica</option>
      <option>Busca Ativa</option>
      <option>Receita</option>
      <option>Consulta/Exame</option>
      <option>Entrega de Resultado</option>
      <option>Outros</option>
    </select>

    <textarea id="anotacoes" placeholder="Anotações"></textarea>

    <button class="primary" onclick="abrirAssinatura()">✍️ Assinar Responsável</button>
    <img id="preview" style="width:100%">

    <button class="success" onclick="finalizar()">Finalizar</button>

  </div>
</div>

<!-- HISTÓRICO -->
<div class="container" id="historicoTela" style="display:none;">
<h2>Histórico de Visitas</h2>

<button class="btn-gray" onclick="mostrarTela('form')">Voltar</button>
<div class="campo-data">
  <label>📅 Filtrar por data</label>
  <input type="date" id="filtroData" onchange="filtrar()">
</div>

<div id="lista"></div>
</div>

<!-- RELATÓRIO -->
<div class="container" id="relatorioTela" style="display:none;">
<div class="topo-relatorio">
  <h2>Relatório de Visitas</h2>
  <button class="btn-gray" onclick="mostrarTela('form')">Voltar</button>
</div>
<div id="relatorio"></div>
</div>

<!-- ASSINATURA -->
<div id="assinaturaTela">
  <div class="canvas-container">
    <canvas id="canvas"></canvas>
  </div>

  <div class="assinatura-botoes">
    <button onclick="limpar()">Limpar</button>
    <button onclick="salvarAssinatura()" class="success">Salvar</button>
    <button onclick="fechar()" class="danger">Cancelar</button>
  </div>
</div>

<!-- MENU -->
<div class="bottom-nav" id="menu" style="display:none;">

  <button onclick="ativarMenu(this,'form')" class="active">
    <span>📋</span>
    Form
  </button>

  <button onclick="ativarMenu(this,'historico')">
    <span>📂</span>
    Histórico
  </button>

  <button onclick="ativarMenu(this,'relatorio')">
    <span>📊</span>
    Relatório
  </button>

</div>

<script>

let lastX = 0;
let lastY = 0;

const { jsPDF } = window.jspdf;

/* DEVICE */
function getDeviceId(){
 let id = localStorage.getItem("deviceId");
 if(!id){
  id = Math.random().toString(36).substring(2);
  localStorage.setItem("deviceId", id);
 }
 return id;
}

/* ATIVAÇÃO */
function ativar(){
 let cod = codigo.value.trim();
 let esperado = btoa(getDeviceId()+"_VISITAFACIL");

 if(cod === esperado){
  localStorage.setItem("licenciado","sim");
  iniciar();
 }else{
  alert("Código inválido");
 }
}

/* INICIAR */
function iniciar(){
 ativacao.style.display="none";

 let info = JSON.parse(localStorage.getItem("info"));

 // SEMPRE mostra a tela de abertura
 abertura.style.display="flex";
 formTela.style.display="none";
 menu.style.display="none";
 headerInfo.style.display="none";

 // Se já tiver dados salvos, preenche automaticamente
 if(info){
  ubs.value = info.ubs || "";
  acs.value = info.acs || "";
  micro.value = info.micro || "";
 }
}

/* ABRIR SISTEMA */
function abrirSistema(){

 if(!ubs.value || !acs.value || !micro.value){
  return alert("Preencha tudo");
 }

 let info = {
  ubs: ubs.value,
  acs: acs.value,
  micro: micro.value
 };

 localStorage.setItem("info", JSON.stringify(info));

 abertura.style.display="none";
 formTela.style.display="block";
 menu.style.display="flex";
 headerInfo.style.display="block";

 headerInfo.innerHTML = `${info.ubs} | ${info.acs} | ${info.micro}`;
}

/* DATA */
function atualizarData(){
 datetime.value = new Date().toLocaleString("pt-BR");
}

/* CEP */
function buscarCEP(){
 fetch(`https://viacep.com.br/ws/${cep.value}/json/`)
 .then(r=>r.json())
 .then(d=> endereco.value=`${d.logradouro}, ${d.localidade}`);
}

/* MEMBRO */
function addMembro(){
 let i=document.createElement("input");
 membros.appendChild(i);
}

/* ASSINATURA */
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

function ajustarCanvas(){
 const rect = canvas.parentElement.getBoundingClientRect();
 const dpr = window.devicePixelRatio || 1;

 canvas.width = rect.width * dpr;
 canvas.height = rect.height * dpr;

 ctx.setTransform(1,0,0,1,0,0);
 ctx.scale(dpr,dpr);
 ctx.lineWidth = 2;
 ctx.lineCap = "round";
 ctx.lineJoin = "round";
}

let desenhando = false;

function getPos(e){
 const rect = canvas.getBoundingClientRect();
 return {
  x: e.clientX - rect.left,
  y: e.clientY - rect.top
 };
}

canvas.addEventListener("pointerdown", e=>{
 e.preventDefault();
 desenhando = true;

 const p = getPos(e);

 lastX = p.x;
 lastY = p.y;

 ctx.beginPath();
 ctx.moveTo(lastX, lastY);
});

canvas.addEventListener("pointermove", e=>{
 if(!desenhando) return;
 e.preventDefault();

 const p = getPos(e);

 const midX = (lastX + p.x) / 2;
 const midY = (lastY + p.y) / 2;

 const pressure = e.pressure || 0.5;
 ctx.lineWidth = 1 + (pressure * 3);

 ctx.quadraticCurveTo(lastX, lastY, midX, midY);
 ctx.stroke();

 lastX = p.x;
 lastY = p.y;
});

canvas.addEventListener("pointerup", ()=> desenhando=false);
canvas.addEventListener("pointercancel", ()=> desenhando=false);
canvas.addEventListener("pointerleave", ()=> desenhando=false);

function abrirAssinatura(){
 assinaturaTela.style.display="flex";

 setTimeout(()=>{
  ajustarCanvas();
  limpar();
 },100);
}

function limpar(){
 ctx.clearRect(0,0,canvas.width,canvas.height);
}

function salvarAssinatura(){

 const tempCanvas = document.createElement("canvas");
 const tempCtx = tempCanvas.getContext("2d");

 tempCanvas.width = canvas.width;
 tempCanvas.height = canvas.height;

 // FUNDO BRANCO
 tempCtx.fillStyle = "#fff";
 tempCtx.fillRect(0,0,tempCanvas.width,tempCanvas.height);

 // desenha assinatura por cima
 tempCtx.drawImage(canvas,0,0);

 preview.src = tempCanvas.toDataURL("image/png");

 fechar();
}

function fechar(){
 assinaturaTela.style.display = "none";
}

/* LIMPAR */
function limparFormulario(){
 document.querySelectorAll("input,textarea").forEach(i=>i.value="");
 membros.innerHTML="";
 preview.src="";
}

/* FINALIZAR */
function finalizar(){
 let info = JSON.parse(localStorage.getItem("info"));

 let agora=new Date();
 let dataLocal = agora.toISOString().split("T")[0];

 let dados={
  ...info,
  id:Date.now(),
  dataFiltro:dataLocal,
  dataBR:agora.toLocaleString("pt-BR"),
  endereco:endereco.value,
  numero:numero.value,
  complemento:complemento.value,
  responsavel:responsavel.value,
  motivo:motivo.value,
  anotacoes:anotacoes.value,
  assinatura:preview.src,
  membros:[...document.querySelectorAll("#membros input")].map(i=>i.value)
 };

 let hist=JSON.parse(localStorage.getItem("visitas")||"[]");
 hist.push(dados);
 localStorage.setItem("visitas",JSON.stringify(hist));

 gerarPDF(dados);
 limparFormulario();
 alert("Salvo");
}

/* PDF */
function gerarPDF(d){
 const doc = new jsPDF();
 let y = 15;

 // TÍTULO
 doc.setFontSize(16);
 doc.text("Visita Domiciliar",105,10,{align:"center"});

 // CABEÇALHO
 doc.setFontSize(10);
 doc.text(`UBS: ${d.ubs}`,10,20);
 doc.text(`ACS: ${d.acs}`,10,25);
 doc.text(`Micro área: ${d.micro}`,10,30);

 y = 40;

 function linha(titulo, valor){
  doc.setFont(undefined,"bold");
  doc.text(titulo,10,y);

  doc.setFont(undefined,"normal");
  let linhas = doc.splitTextToSize(valor || "-",180);

  y+=5;
  doc.text(linhas,10,y);

  y += linhas.length * 6 + 2;

  // linha divisória
  doc.line(10,y,200,y);
  y+=5;
 }

 linha("Data:", d.dataBR);
 linha("Responsável:", d.responsavel);
 linha("Endereço:", `${d.endereco}, Nº ${d.numero} ${d.complemento || ""}`);
 linha("Motivo:", d.motivo);
 linha("Anotações:", d.anotacoes);

 if(d.membros && d.membros.length){
  linha("Membros:", d.membros.join(", "));
 }

 if(d.assinatura){
  doc.text("Assinatura:",10,y);
  y+=5;
  doc.addImage(d.assinatura,"PNG",10,y,80,30);
 }

 doc.save((d.responsavel || "visita") + ".pdf");
}

/* HISTÓRICO */
function filtrar(){
 let data=filtroData.value;
 let dados=JSON.parse(localStorage.getItem("visitas")||"[]");
 listar(!data?dados:dados.filter(v=>v.dataFiltro===data));
}

function listar(dados){
 lista.innerHTML="";
 
 // 🔥 ORDENA DO MAIS RECENTE PARA O MAIS ANTIGO
 dados.sort((a,b) => b.id - a.id);

 dados.forEach(d=>{
  lista.innerHTML+=`
  <div class="card">
    ${d.dataBR}<br>${d.responsavel}

    <div style="display:flex; gap:8px; margin-top:10px;">
      <button class="btn-blue" onclick='gerarPDF(${JSON.stringify(d)})'>📄 PDF</button>
      <button class="danger" onclick='excluir(${d.id})'>🗑 Excluir</button>
    </div>

  </div>`;
 });
}

/* RELATÓRIO */
function gerarRelatorio(){

 let dados = JSON.parse(localStorage.getItem("visitas") || "[]");

 let resumo = {};

 // AGRUPA POR MOTIVO
 dados.forEach(d=>{
  if(!d.motivo) return;
  resumo[d.motivo] = (resumo[d.motivo] || 0) + 1;
 });

 // MONTA HTML BONITO
 relatorio.innerHTML = `
<b>Total de visitas:</b> ${dados.length}<br><br>
${Object.entries(resumo)
  .map(([k,v]) => `<div style="margin-bottom:5px;">• ${k}: <b>${v}</b></div>`)
  .join("")
}
`;
}

/* NAV */
function mostrarTela(t){
 formTela.style.display="none";
 historicoTela.style.display="none";
 relatorioTela.style.display="none";

 if(t==="form") formTela.style.display="block";
 if(t==="historico"){historicoTela.style.display="block"; filtrar();}
 if(t==="relatorio"){relatorioTela.style.display="block"; gerarRelatorio();}
}

function ativarMenu(btn, tela){

 // remove ativo de todos
 document.querySelectorAll(".bottom-nav button")
 .forEach(b => b.classList.remove("active"));

 // ativa o clicado
 btn.classList.add("active");

 // troca tela
 mostrarTela(tela);
}

/* LOAD */
window.onload=()=>{
 deviceId.innerText=getDeviceId();

 if(!localStorage.getItem("licenciado")){
  ativacao.style.display="flex";
 }else{
  iniciar();
 }

 setInterval(atualizarData,1000);
};

function excluir(id){

 if(!confirm("Deseja realmente excluir esta visita?")) return;

 let dados = JSON.parse(localStorage.getItem("visitas") || "[]");

 dados = dados.filter(v => v.id !== id);

 localStorage.setItem("visitas", JSON.stringify(dados));

 filtrar(); // atualiza a tela
}

</script>
